schema_version: 1

context:
  version: 2.53.0

package:
  name: git
  version: ${{ version }}

source:
  - url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-${{ version }}.tar.gz
    sha256: 429dc0f5fe5f14109930cdbbb588c5d6ef5b8528910f0d738040744bebdc6275  # [not win]
    target_directory: code
    patches:  # [not win]
      - if: not win
        then: 0001-macOS-Do-not-use-the-system-Wish-urgh.patch
  - url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-manpages-${{ version }}.tar.gz
    sha256: 4954390466c125e82dce4a978dd1dadda13a916564d908cfdbd319f2e174a8ae  # [not win]
    target_directory: manpages
  - url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-htmldocs-${{ version }}.tar.gz
    sha256: 90132f48015eae5ead640cbc484df8c6dc055544d1660d818163ac1df6f93c7e  # [not win]
    target_directory: htmldocs
  - url: https://github.com/git-for-windows/git/releases/download/v${{ version }}.windows.1/PortableGit-${{ version }}-64-bit.7z.exe
    sha256: 08713a710ec91ac90de1c09f861289a3b103175f098676e5e664c04dd6c6bf23  # [win64]
    target_directory: .

build:
  # git hardcodes paths to external utilities (e.g. curl)
  number: 0
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - if: unix
      then: ${{ stdlib('c') }}
    - if: unix
      then: ${{ compiler('c') }}
    - if: unix
      then: ${{ stdlib("c") }}
    - if: unix
      then: autoconf
    - if: unix
      then: make
    - if: win
      then: 7za
    - if: unix
      then: tk
    - if: unix
      then: gettext-tools
  host:
    - if: osx
      then: libintl-devel
    - if: unix
      then: libcurl
    - if: unix
      then: expat
    - if: unix
      then: libiconv
    - if: unix
      then: openssl
    - if: unix
      then: pcre2
    - if: unix
      then: perl 5.*
    - if: unix
      then: zlib
  run:
    # Without the explicit dependency on curl, it seems
    # that linux_64 fails on the symbol lookup for curl_global_sslset
    - if: unix
      then: perl 5.*
  ignore_run_exports:
    from_package:
      - if: unix
        then: perl 5.*

tests:
  - script:
      - if: unix
        then: test -f $PREFIX/bin/git
      - if: unix
        then: test -f $PREFIX/bin/gitk
      - if: osx
        then: test -f $PREFIX/bin/git-credential-osxkeychain
      - if: win
        then: if not exist %LIBRARY_PREFIX%\\bin\\git.exe exit 1
      - git --version
      - git clone https://github.com/conda-forge/git-feedstock
      - if: osx
        then: git-credential-osxkeychain 2>&1 | grep -q usage
      - if: unix
        then: bash $PREFIX/share/bash-completion/completions/git
      - if: not win
        then: test -f $PREFIX/man/man1/git.1
      - if: osx
        then: test -f $PREFIX/share/man/man1/git.1
      - if: not win
        then: test -f $PREFIX/share/doc/git/index.html

about:
  license: GPL-2.0-or-later and LGPL-2.1-or-later
  license_file: code/COPYING  # [not win]
  summary: distributed version control system
  homepage: https://git-scm.com/

extra:
  recipe-maintainers:
    - jakirkham
    - msarahan
    - pelson
    - scopatz
    - ocefpaf
    - djsutherland
    - ytausch
